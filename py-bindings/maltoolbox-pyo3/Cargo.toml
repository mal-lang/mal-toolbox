[workspace]

[package]
name = "maltoolbox-pyo3"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
maltoolbox-language-py = { path = "../maltoolbox-language-py" }
maltoolbox-model-py = { path = "../maltoolbox-model-py" }
maltoolbox-attackgraph-py = { path = "../maltoolbox-attackgraph-py" }
pyo3 = { version = "0.29.3", features = ["extension-module"] }
