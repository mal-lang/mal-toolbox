[package]
name = "maltoolbox-pyo3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
maltoolbox-language-py = { workspace = true }
maltoolbox-model-py = { workspace = true }
maltoolbox-attackgraph-py = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"] }
