[workspace]

[package]
name = "maltoolbox-language-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "maltoolbox_language_py"
path = "src/lib.rs"

[dependencies]
maltoolbox-language = { path = "../../crates/maltoolbox-language" }
maltoolbox-fileutil = { path = "../../crates/maltoolbox-fileutil" }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
pythonize = "0.29.0"
pyo3 = "0.29.3"
